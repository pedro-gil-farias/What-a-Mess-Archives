name: Ingest specimen submission

on:
  issues:
    types: [labeled]

# One run at a time so specimen IDs are assigned sequentially.
concurrency:
  group: ingest-submission
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'specimen-submission') &&
      !contains(github.event.issue.labels.*.name, 'ingested')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add specimen
        id: ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/ingest-submission.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Specimens
          git commit -m "Add ${{ steps.ingest.outputs.id }} from submission #${ISSUE_NUMBER}"
          git push

      - name: Close the issue
        env:
          NEW_ID: ${{ steps.ingest.outputs.id }}
          MODEL_MISSING: ${{ steps.ingest.outputs.model_missing }}
          MODEL_PATH: ${{ steps.ingest.outputs.model_path }}
          THUMBNAIL_MISSING: ${{ steps.ingest.outputs.thumbnail_missing }}
          THUMBNAIL_PATH: ${{ steps.ingest.outputs.thumbnail_path }}
        run: |
          gh label create ingested --repo "$GITHUB_REPOSITORY" --force --color 0e8a16
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ingested
          message="Added to the archive as $NEW_ID."
          if [ "$MODEL_MISSING" = "true" ]; then
            message="$message The model link was not a direct .glb, so add the model by hand at \`$MODEL_PATH\`."
          fi
          if [ "$THUMBNAIL_MISSING" = "true" ]; then
            message="$message No usable thumbnail was found, so add the image by hand at \`$THUMBNAIL_PATH\`."
          fi
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$message"

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "The submission could not be added automatically. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for the reason, fix the issue text, then remove and re-add the \`approved\` label."
