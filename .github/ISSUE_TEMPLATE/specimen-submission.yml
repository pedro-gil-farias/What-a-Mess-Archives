name: Submit a specimen
description: Contribute a 3D scan to the What A Mess Archives
title: "Specimen submission: "
labels: ["specimen-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing. A maintainer reviews every submission before it goes live.
        Your model is downloaded from the link you give, optimized, and hosted in this repository.
  - type: input
    id: title
    attributes:
      label: Title
      description: A short name for the specimen, e.g. "Rusty Swing".
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: City and country, e.g. "Rotterdam, The Netherlands".
    validations:
      required: true
  - type: input
    id: maps_url
    attributes:
      label: Google Maps link
      description: Find the spot on Google Maps, right-click it (or long-press on a phone), choose Share, and copy the link. Coordinates are read from this link.
      placeholder: "https://maps.app.goo.gl/..."
    validations:
      required: true
  - type: input
    id: latitude
    attributes:
      label: Latitude (optional)
      description: Only fill this in if you want to override the link. Right-click the spot on Google Maps and click the numbers at the top of the menu to copy them.
      placeholder: "51.9225"
    validations:
      required: false
  - type: input
    id: longitude
    attributes:
      label: Longitude (optional)
      description: Same as above, the second number.
      placeholder: "4.4792"
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Date scanned
      description: Format YYYY-MM-DD.
      placeholder: "2026-03-14"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What makes this specimen interesting? Plain text only.
    validations:
      required: true
  - type: input
    id: model_url
    attributes:
      label: Link to the 3D model (.glb)
      description: A direct download link to a GLB file. Dropbox and Google Drive share links work. Use https.
    validations:
      required: true
  - type: input
    id: thumbnail_url
    attributes:
      label: Link to a thumbnail image (PNG or JPG)
      description: A direct download link, around 400x280 px or larger.
    validations:
      required: true
  - type: input
    id: gif_url
    attributes:
      label: Link to an animated GIF (optional)
      description: Plays when someone hovers over the specimen.
    validations:
      required: false
  - type: input
    id: contributor
    attributes:
      label: Your name (for credit)
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I made this scan, and I agree to it being published in this public archive with my name as credit.
          required: true
