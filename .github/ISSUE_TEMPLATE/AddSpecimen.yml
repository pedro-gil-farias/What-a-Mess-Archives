name: Add 3D Scan
description: Submit a new 3D scan entry to be added to the dataset
title: "Add 3D Scan: {{title}}"
labels:
  - 3d-scan
  - data-submission
  - needs-review

body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a 3D scan!
        Please fill out the fields below. The information will be reviewed and added to the dataset.

  - type: input
    id: title
    attributes:
      label: Title
      description: Descriptive title for the scan
      placeholder: Church Renovation
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: City and country
      placeholder: Gothenburg, Sweden
    validations:
      required: true

  - type: input
    id: mapsLink
    attributes:
      label: Google Maps Link
      description: Share a Google Maps link to the location
      placeholder: https://maps.google.com/?q=57.7089,11.9746
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Capture Date
      description: Date the scan was captured (YYYY-MM-DD)
      placeholder: "2023-03-26"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the scene, context, and significance
      placeholder: Describe the environment, conditions, and why this scan matters
    validations:
      required: true

  - type: file
    id: modelFile
    attributes:
      label: 3D Model File (.glb)
      description: Upload the 3D model file
      accept: ".glb"
    validations:
      required: true

  - type: file
    id: thumbnailImage
    attributes:
      label: Thumbnail Image
      description: Upload the thumbnail image
      accept: ".png,.jpg,.jpeg"
    validations:
      required: true

  - type: file
    id: gifFile
    attributes:
      label: GIF Path (optional)
      description: Upload an animated preview (optional)
      accept: ".gif"
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm that the paths exist in the repository (or will be added in this PR)
          required: true
        - label: I confirm the metadata is accurate to the best of my knowledge
          required: true
